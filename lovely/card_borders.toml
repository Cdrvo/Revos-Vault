[manifest]
version = "1.0.0"
dump_lua = true
priority = 1



[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''-- TARGET: evaluate your own general effects'''
position = 'before'
payload = '''
 for _,k in ipairs(RevosVault.MISC.Border.obj_buffer) do
        local v = RevosVault.MISC.Borders[k]
        local border = card:crv_calculate_border(context, k)
        if border then
        print("f should trigger yes")
            ret.crv_border = border
        end
    end
'''
match_indent = true
[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = '''-- TARGET: evaluate your own repetition effects'''
position = 'before'
payload = '''
 for _,k in ipairs(RevosVault.MISC.Border.obj_buffer) do
        local v = RevosVault.MISC.Borders[k]
        local border = card:crv_calculate_border(context, k)
        if border then
        print("f should trigger yes")
            ret.crv_border = border
        end
    end
'''
match_indent = true

# generate_UIBox_ability_table()
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.sticker or ((self.sticker_run and self.sticker_run~='NONE') and G.SETTINGS.run_stake_stickers)  then loc_vars = loc_vars or {}; loc_vars.sticker=(self.sticker or self.sticker_run) end"
position = "before"
match_indent = true
payload = '''
for k, v in ipairs(RevosVault.MISC.Border.obj_buffer) do
	if self and self.ability and self.ability[v] and not RevosVault.MISC.Borders[v].hide_badge then
        badges[#badges+1] = v
    end
end'''

# generate_card_ui()
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if v == 'eternal' then*"
match_indent = true
position = "before"
payload = '''
local sticker = RevosVault.MISC.Borders[v]
if sticker then
    local t = { key = v, set = 'crv_Border' }
    local res = {}
    if sticker.loc_vars and type(sticker.loc_vars) == 'function' then
        res = sticker:loc_vars(info_queue, card) or {}
        t.vars = res.vars or {}
        t.key = res.key or t.key
        t.set = res.set or t.set
    end
    info_queue[#info_queue+1] = t
end'''

# Add Borders as a set to be localized here
[[patches]]
[patches.pattern]
target = '''functions/common_events.lua'''
pattern = '''if _c.set == 'Other' then
        localize{type = 'other', key = _c.key, nodes = desc_nodes, vars = specific_vars or _c.vars}'''
position = 'after'
payload = '''
elseif _c.set == 'crv_Border' then
  localize{type = 'descriptions', key = _c.key, set = _c.set, nodes = desc_nodes, vars = specific_vars or _c.vars}
'''
match_indent = true

# Add mod badge
# Apparently, this is taken from Papeback
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "badges.mod_set = nil"
position = "before"
payload = '''
if RevosVault then
  for k, v in pairs(RevosVault.MISC.Borders) do
    if card and card.ability and card.ability[k] and G.your_collection then
      for i = 1, #G.your_collection do
          if card.area == G.your_collection[i] then
              SMODS.create_mod_badges(RevosVault.MISC.Borders[k], badges)
          end
      end
    end
  end
end
'''
match_indent = true

# get_badge_colour()
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = 'return G.BADGE_COL[key] or {1, 0, 0, 1}'
position = 'before'
match_indent = true
payload = '''
if RevosVault then
  for k, v in pairs(RevosVault.MISC.Borders) do
      G.BADGE_COL[k] = v.badge_colour
  end
end
'''